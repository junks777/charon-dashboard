<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charon Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { 800: '#1a1a2e', 900: '#0f0f1a', 700: '#16213e', 600: '#1a1a3e' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body { background: #0f0f1a; }
    .sidebar-item { @apply flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors; }
    .sidebar-item:hover { @apply bg-indigo-500/10 text-indigo-300; }
    .sidebar-item.active { @apply bg-indigo-500/20 text-indigo-400; }
    .card { @apply bg-dark-800/80 border border-white/5 rounded-xl p-5 backdrop-blur-sm; }
    .stat-value { @apply text-2xl font-bold text-white; }
    .stat-label { @apply text-xs text-gray-400 uppercase tracking-wider; }
    .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium; }
    .badge-green { @apply bg-emerald-500/20 text-emerald-400; }
    .badge-red { @apply bg-red-500/20 text-red-400; }
    .badge-yellow { @apply bg-yellow-500/20 text-yellow-400; }
    .badge-blue { @apply bg-blue-500/20 text-blue-400; }
    .badge-gray { @apply bg-gray-500/20 text-gray-400; }
    .badge-purple { @apply bg-purple-500/20 text-purple-400; }
    .table-header { @apply px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider; }
    .table-cell { @apply px-4 py-3 text-sm whitespace-nowrap; }
    .refresh-btn { @apply px-3 py-1.5 text-xs font-medium rounded-lg bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500/30 transition-colors; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .tab-btn { @apply px-4 py-2 text-sm font-medium rounded-lg transition-colors; }
    .tab-btn.active { @apply bg-indigo-500/20 text-indigo-400; }
    .tab-btn:not(.active) { @apply text-gray-400 hover:text-gray-300; }
    .skeleton { @apply animate-pulse bg-white/5 rounded; }
    .pos-card { @apply bg-dark-800/80 border border-white/5 rounded-xl overflow-hidden backdrop-blur-sm; }
    .pos-card-down { border-color: rgba(239,68,68,0.2); }
    .pos-card-up { border-color: rgba(52,211,153,0.2); }
    .flag-down { background: linear-gradient(90deg, rgba(239,68,68,0.15), transparent); }
    .flag-up { background: linear-gradient(90deg, rgba(52,211,153,0.15), transparent); }
    .minimap-cell { width: 12px; height: 12px; border-radius: 2px; transition: transform .15s; }
    .minimap-cell:hover { transform: scale(1.3); }
    .stat-tile { @apply bg-dark-800/80 border border-white/5 rounded-xl p-4 backdrop-blur-sm; }
    .stat-tile .label { @apply text-xs text-gray-500 uppercase tracking-wider; }
    .stat-tile .value { @apply text-xl font-bold text-white mt-0.5; }
    .gmgn-btn { @apply text-xs bg-blue-500/20 text-blue-400 hover:bg-blue-500/30 px-2.5 py-1 rounded transition-colors; }
    .birdeye-btn { @apply text-xs bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 px-2.5 py-1 rounded transition-colors; }
  </style>
</head>
<body class="dark text-gray-100">

          Strategies
        </a>

          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Settings

      <div class="px-4 py-3 border-t border-white/5 mt-auto">

          <span id="last-update">Connecting...</span>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6">
      <!-- Pages -->
      <div id="page-overview" class="page"></div>
      <div id="page-positions" class="page hidden"></div>
      <div id="page-trades" class="page hidden"></div>
      <div id="page-candidates" class="page hidden"></div>
      <div id="page-activity" class="page hidden"></div>
      <div id="page-strategies" class="page hidden"></div>
      <div id="page-settings-page" class="page hidden"></div>

<script>
// ── Utility Functions ─────────────────────────────────────────────────────────
function fmtSol(v) { const n = Number(v); return Number.isFinite(n) ? n.toFixed(4) + ' SOL' : '?'; }
function fmtUsd(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return '?';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(2);
}
function fmtPct(v) { const n = Number(v); return Number.isFinite(n) ? n.toFixed(1) + '%' : '?'; }
function shortAddr(a) { return a ? a.slice(0, 6) + '...' + a.slice(-4) : '?'; }
function timeAgo(ms) {
  if (!ms) return '';
  const sec = Math.floor((Date.now() - ms) / 1000);
  if (sec < 60) return sec + 's ago';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
  if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
  return Math.floor(sec / 86400) + 'd ago';
}
function fmtDate(ms) { return ms ? new Date(ms).toLocaleString() : ''; }

function pnlClass(pct) {
  const n = Number(pct);
  if (n > 0) return 'text-emerald-400';
  if (n < 0) return 'text-red-400';
  return 'text-gray-400';
}

function statusBadge(status) {
  const map = {
    open: 'badge-green', closed: 'badge-gray', candidate: 'badge-blue', filtered: 'badge-yellow',
    buy: 'badge-green', watch: 'badge-yellow', pass: 'badge-gray', ignored: 'badge-gray',
    pending_confirmation: 'badge-yellow', executed_live: 'badge-green', execution_failed: 'badge-red',
    rejected: 'badge-red', new: 'badge-blue',
  };
  const cls = map[status] || 'badge-gray';
  return `<span class="badge ${cls}">${status}</span>`;
}

function verdictBadge(v) {
  const map = { BUY: 'badge-green', WATCH: 'badge-yellow', PASS: 'badge-gray' };
  return `<span class="badge ${map[v] || 'badge-gray'}">${v || '?'}</span>`;
}

// ── Navigation ────────────────────────────────────────────────────────────────
const pages = ['overview', 'positions', 'trades', 'candidates', 'activity', 'strategies', 'settings-page'];
let currentPage = 'overview';

document.querySelectorAll('.sidebar-item').forEach(el => {
  el.addEventListener('click', e => {
    e.preventDefault();
    const page = el.dataset.page;
    if (!page) return;
    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    pages.forEach(p => document.getElementById('page-' + p).classList.add('hidden'));
    document.getElementById('page-' + page).classList.remove('hidden');
    currentPage = page;
    loadPage(page);
  });
});

// ── API Fetch ─────────────────────────────────────────────────────────────────
async function api(path) {
  const res = await fetch('/api' + path);
  if (!res.ok) throw new Error(res.statusText);
  return res.json();
}

async function charonApi(method, path, body) {
  const res = await fetch('/api' + path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function notify(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `fixed top-4 right-4 z-50 px-4 py-2 rounded-lg text-sm font-medium shadow-lg transition-all duration-300 ${
    type === 'success' ? 'bg-emerald-500/90 text-white' : 'bg-red-500/90 text-white'
  }`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
}

let refreshInterval = null;

function startAutoRefresh() {
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(() => {
    loadPage(currentPage);
  }, 5000);
}

async function refreshAll() {
  document.getElementById('last-update').textContent = 'Refreshing...';
  await loadPage(currentPage);
}

async function loadPage(page) {
  try {
    document.getElementById('status-dot').className = 'inline-block w-2 h-2 rounded-full bg-yellow-400';
    document.getElementById('last-update').textContent = 'Loading...';
    const handlers = {
      overview: loadOverview,
      positions: loadPositions,
      trades: loadTrades,
      candidates: loadCandidates,
      activity: loadActivity,
      strategies: loadStrategies,
      'settings-page': loadSettings,
    };
    if (handlers[page]) await handlers[page]();
    document.getElementById('status-dot').className = 'inline-block w-2 h-2 rounded-full bg-emerald-400';
    document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('status-dot').className = 'inline-block w-2 h-2 rounded-full bg-red-400';
    document.getElementById('last-update').textContent = 'Error: ' + err.message;
  }
}

// ── Overview Page ─────────────────────────────────────────────────────────────
async function loadOverview() {
  const [stats, positions, closedPositions, strategies, settings] = await Promise.all([
    api('/stats'), api('/positions'), api('/trades'), api('/strategies'), api('/settings')
  ]);

  // Compute unrealized PnL from open positions
  let unrealizedSol = 0;
  positions.forEach(p => {
    const entryMcap = Number(p.entry_mcap);
    const currentMcap = Number(p.currentMcap);
    if (entryMcap > 0 && currentMcap > 0) {
      const pct = (currentMcap / entryMcap - 1);
      unrealizedSol += Number(p.size_sol) * pct;
    }
  });

  // TP/SL ratio from closed positions
  const tpCount = closedPositions.filter(p => (p.exit_reason || '').startsWith('TP')).length;
  const slCount = closedPositions.filter(p => (p.exit_reason || '').startsWith('SL')).length;

  // Win/loss breakdown
  const winCount = Number(stats.pnl.wins) || 0;
  const lossCount = Number(stats.pnl.losses) || 0;
  const totalClosed = winCount + lossCount;
  const winRate = totalClosed > 0 ? (winCount / totalClosed * 100).toFixed(1) : '0.0';

  // Build chart data from closed positions (cumulative PnL over time)
  const chartData = buildPnlChartData(closedPositions);

  const html = `
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-white">Overview</h1>
      <p class="text-sm text-gray-400 mt-1">Trading Bot Performance</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
      <div class="stat-tile">
        <div class="label">OPEN</div>
        <div class="value">${stats.openPositions}</div>
        <div class="text-xs text-gray-500 mt-0.5">Live: ${stats.livePositions}</div>
      </div>
      <div class="stat-tile">
        <div class="label">WINRATE</div>
        <div class="value">${winRate}%</div>
        <div class="text-xs text-gray-500 mt-0.5"><span class="text-emerald-400">${winCount}W</span> / <span class="text-red-400">${lossCount}L</span></div>
      </div>
      <div class="stat-tile">
        <div class="label">UNREALIZED</div>
        <div class="value ${pnlClass(unrealizedSol)}">${fmtSol(unrealizedSol)}</div>
        <div class="text-xs text-gray-500 mt-0.5">Open positions</div>
      </div>
      <div class="stat-tile">
        <div class="label">NET SOL</div>
        <div class="value ${pnlClass(stats.pnl.totalSol)}">${fmtSol(stats.pnl.totalSol)}</div>
        <div class="text-xs text-gray-500 mt-0.5">Realized PnL</div>
      </div>
      <div class="stat-tile">
        <div class="label">AVG PNL</div>
        <div class="value ${pnlClass(stats.pnl.avgPct)}">${fmtPct(stats.pnl.avgPct)}</div>
        <div class="text-xs text-gray-500 mt-0.5">Per closed trade</div>
      </div>
      <div class="stat-tile">
        <div class="label">TP/SL</div>
        <div class="value">${tpCount}<span class="text-xs text-gray-500">/</span>${slCount}</div>
        <div class="text-xs text-gray-500 mt-0.5">${totalClosed} closed</div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
      <div class="lg:col-span-2 card">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-semibold text-white uppercase tracking-wider">Performance Trend</h2>
          <span class="text-xs text-gray-500">Realized PnL (SOL)</span>
        </div>
        <canvas id="pnlChart" height="200"></canvas>
      </div>
      <div class="space-y-4">
        <div class="card">
          <h2 class="text-sm font-semibold text-white uppercase tracking-wider mb-3">Active Strategy</h2>
          ${stats.activeStrategy ? `
          <div class="space-y-1.5 text-sm">
            <div class="flex justify-between"><span class="text-gray-400">Name</span><span class="text-white font-medium">${stats.activeStrategy.name}</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Mode</span><span class="text-indigo-400">${stats.activeStrategy.entry_mode || 'immediate'}</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Max Pos</span><span class="text-white">${stats.activeStrategy.max_open_positions}</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Size</span><span class="text-white">${fmtSol(stats.activeStrategy.position_size_sol)}</span></div>
            <div class="flex justify-between"><span class="text-gray-400">TP / SL</span><span><span class="text-emerald-400">${fmtPct(stats.activeStrategy.tp_percent)}</span> / <span class="text-red-400">${fmtPct(stats.activeStrategy.sl_percent)}</span></span></div>
            <div class="flex justify-between"><span class="text-gray-400">Trailing</span><span class="text-white">${stats.activeStrategy.trailing_enabled ? fmtPct(stats.activeStrategy.trailing_percent) : 'off'}</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Mcap Range</span><span class="text-white">${fmtUsd(stats.activeStrategy.min_mcap_usd)} - ${stats.activeStrategy.max_mcap_usd > 0 ? fmtUsd(stats.activeStrategy.max_mcap_usd) : '∞'}</span></div>
            <div class="flex justify-between"><span class="text-gray-400">GMGN Fee</span><span class="text-white">${fmtSol(stats.activeStrategy.min_fee_claim_sol)} min</span></div>
          </div>` : '<div class="text-gray-500 text-sm">No active strategy</div>'}
        </div>
        <div class="card">
          <h2 class="text-sm font-semibold text-white uppercase tracking-wider mb-3">Runtime Config</h2>
          <div class="space-y-1.5 text-sm">
            <div class="flex justify-between"><span class="text-gray-400">Trading Mode</span><span class="text-indigo-400">${stats.settings.tradingMode}</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Signal Poll</span><span class="text-white">${stats.activeStrategy ? ((settings.find(s => s.key === 'GRADUATED_POLL_MS')?.value || '30') + 's') : '?'}</span></div>
            <div class="flex justify-between"><span class="text-gray-400">LLM Candidates</span><span class="text-white">${stats.totalCandidates}</span></div>
            <div class="flex justify-between"><span class="text-gray-400">LLM Min Conf</span><span class="text-white">${stats.activeStrategy?.llm_min_confidence || '?'}%</span></div>
            <div class="flex justify-between"><span class="text-gray-400">GMGN Delay</span><span class="text-white">${stats.activeStrategy ? ((settings.find(s => s.key === 'GMGN_CACHE_TTL_MS')?.value || '5') + 's') : '?'}</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Active Lessons</span><span class="text-white">${stats.totalDecisions}</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-white">Open Positions</h2>
        <span class="text-xs text-gray-500">${positions.length} positions</span>
      </div>
      ${positions.length === 0 ? '<div class="text-gray-500 text-sm py-8 text-center">No open positions</div>' : `
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
            <tr class="border-b border-white/5">
              <th class="table-header">Token</th>
              <th class="table-header">Entry Mcap</th>
              <th class="table-header">MC Now</th>
              <th class="table-header">Size</th>
              <th class="table-header">TP / SL</th>
              <th class="table-header">Age</th>
              <th class="table-header">Mode</th>
              <th class="table-header">PnL</th>

  document.getElementById('page-overview').innerHTML = html;

  // Render chart after DOM is ready
  if (chartData.labels.length > 1) {
    renderPnlChart(chartData);
  } else {
    document.getElementById('pnlChart')?.parentElement?.insertAdjacentHTML('beforeend', '<div class="text-gray-500 text-sm text-center py-8">Not enough trade data for chart</div>');
    document.getElementById('pnlChart')?.remove();
  }
}

function buildPnlChartData(closed) {
  const sorted = [...closed].filter(p => p.closed_at_ms).sort((a, b) => a.closed_at_ms - b.closed_at_ms);
  const labels = [];
  const values = [];
  let cum = 0;
  // Group by hour for cleaner display
  const hourly = {};
  sorted.forEach(p => {
    const h = new Date(Number(p.closed_at_ms));
    h.setMinutes(0, 0, 0);
    const key = h.toISOString().slice(0, 13);
    hourly[key] = (hourly[key] || 0) + Number(p.pnl_sol || 0);
  });
  Object.entries(hourly).forEach(([hour, sol]) => {
    cum += sol;
    labels.push(new Date(hour + ':00').toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit' }));
    values.push(Number(cum.toFixed(4)));
  });
  return { labels, values };
}

let pnlChartInstance = null;

function renderPnlChart(data) {
  if (pnlChartInstance) pnlChartInstance.destroy();
  const ctx = document.getElementById('pnlChart')?.getContext('2d');
  if (!ctx) return;
  const isPositive = data.values[data.values.length - 1] >= 0;
  const gradient = ctx.createLinearGradient(0, 0, 0, 200);
  if (isPositive) {
    gradient.addColorStop(0, 'rgba(52,211,153,0.2)');
    gradient.addColorStop(1, 'rgba(52,211,153,0)');
  } else {
    gradient.addColorStop(0, 'rgba(239,68,68,0.2)');
    gradient.addColorStop(1, 'rgba(239,68,68,0)');
  }
  pnlChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.labels,
      datasets: [{
        label: 'Cumulative PnL',
        data: data.values,
        borderColor: isPositive ? '#34d399' : '#ef4444',
        backgroundColor: gradient,
        borderWidth: 2,
        fill: true,
        tension: 0.3,
        pointRadius: 0,
        pointHitRadius: 10,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          ticks: { color: '#6b7280', maxTicksLimit: 8, font: { size: 10 } },
          grid: { color: 'rgba(255,255,255,0.03)' }
        },
        y: {
          ticks: { color: '#6b7280', font: { size: 10 }, callback: v => v.toFixed(3) + ' SOL' },
          grid: { color: 'rgba(255,255,255,0.05)' }
        }
      },
      interaction: { intersect: false, mode: 'index' }
    }
  });
}

      </div>
    </div>
    <div id="act-logs" class="tab-content hidden">
      <div class="card p-0 overflow-x-auto">
        <table class="w-full">
          <thead><tr class="border-b border-white/5">
            <th class="table-header">ID</th><th class="table-header">Mint</th><th class="table-header">Action</th><th class="table-header">Mode</th>
            <th class="table-header">Verdict</th><th class="table-header">Strategy</th><th class="table-header">Time</th>
          </tr></thead>
          <tbody class="divide-y divide-white/5">
            ${decisionLogs.map(l => `<tr class="hover:bg-white/[0.02]">
              <td class="table-cell text-gray-400">#${l.id}</td>
              <td class="table-cell text-xs font-mono text-gray-400">${shortAddr(l.selected_mint || '') || '-'}</td>
              <td class="table-cell text-xs"><span class="badge badge-blue">${l.action || ''}</span></td>
              <td class="table-cell text-xs">${l.mode || ''}</td>
              <td class="table-cell">${verdictBadge(l.verdict)}</td>
              <td class="table-cell text-xs text-gray-400">${l.strategy_id || '-'}</td>
              <td class="table-cell text-gray-400 text-xs">${timeAgo(l.at_ms)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div id="act-signals" class="tab-content hidden">
      <div class="card p-0 overflow-x-auto">
        <table class="w-full">
          <thead><tr class="border-b border-white/5">
            <th class="table-header">ID</th><th class="table-header">Mint</th><th class="table-header">Kind</th><th class="table-header">Source</th><th class="table-header">Time</th>
          </tr></thead>
          <tbody class="divide-y divide-white/5">
            ${signals.map(s => `<tr class="hover:bg-white/[0.02]">
              <td class="table-cell text-gray-400">#${s.id}</td>
              <td class="table-cell text-xs font-mono text-gray-400">${shortAddr(s.mint)}</td>
              <td class="table-cell">${statusBadge(s.kind)}</td>
              <td class="table-cell text-xs text-gray-400">${s.source || ''}</td>
              <td class="table-cell text-gray-400 text-xs">${timeAgo(s.at_ms)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.querySelectorAll('#page-activity .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#page-activity .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('#page-activity .tab-content').forEach(c => c.classList.add('hidden'));
      document.getElementById(btn.dataset.tab).classList.remove('hidden');
    });
  });
}

// ── Strategies Page ───────────────────────────────────────────────────────────
async function loadStrategies() {
  const [strategies, stats] = await Promise.all([api('/strategies'), api('/stats')]);

  document.getElementById('page-strategies').innerHTML = `
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-white">Strategies</h1>
      <p class="text-sm text-gray-400 mt-1">Active: <span class="text-indigo-400 font-medium">${stats.activeStrategy?.name || 'None'}</span></p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      ${strategies.map(s => {
        const active = s.enabled ? 'ring-2 ring-indigo-500/50' : '';
        return `<div class="card ${active}">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-lg font-semibold text-white">${s.name}</h3>
            <div class="flex items-center gap-2">
              ${s.enabled ? '<span class="badge badge-green">Active</span>' : `<button class="activate-strat-btn text-xs bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500/30 px-2 py-1 rounded" data-id="${s.id}">Activate</button>`}
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div><span class="text-gray-400">Entry:</span> <span class="text-white">${s.entry_mode || 'immediate'}</span></div>
            <div><span class="text-gray-400">Min Sources:</span> <span class="text-white">${s.min_source_count}</span></div>
            <div><span class="text-gray-400">Size:</span> <span class="text-white">${fmtSol(s.position_size_sol)}</span></div>
            <div><span class="text-gray-400">Max Pos:</span> <span class="text-white">${s.max_open_positions}</span></div>
            <div><span class="text-gray-400">TP:</span> <span class="text-emerald-400">${fmtPct(s.tp_percent)}</span></div>
            <div><span class="text-gray-400">SL:</span> <span class="text-red-400">${fmtPct(s.sl_percent)}</span></div>
            <div><span class="text-gray-400">Trailing:</span> <span class="text-white">${s.trailing_enabled ? fmtPct(s.trailing_percent) : 'off'}</span></div>
            <div><span class="text-gray-400">LLM:</span> <span class="text-white">${s.use_llm ? 'on (min ' + s.llm_min_confidence + '%)' : 'off'}</span></div>
            <div><span class="text-gray-400">Min Mcap:</span> <span class="text-white">${fmtUsd(s.min_mcap_usd)}</span></div>
            <div><span class="text-gray-400">Max Mcap:</span> <span class="text-white">${s.max_mcap_usd > 0 ? fmtUsd(s.max_mcap_usd) : 'off'}</span></div>
            <div><span class="text-gray-400">Fee Req:</span> <span class="text-white">${s.require_fee_claim ? 'yes' : 'no'}</span></div>
            <div><span class="text-gray-400">Partial TP:</span> <span class="text-white">${s.partial_tp ? s.partial_tp_sell_percent + '% at ' + fmtPct(s.partial_tp_at_percent) : 'off'}</span></div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  document.querySelectorAll('#page-strategies .activate-strat-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      try {
        await charonApi('POST', `/strategy/${id}/activate`);
        notify(`Strategy "${id}" activated`);
        loadStrategies();
      } catch (err) { notify(err.message, 'error'); }
    });
  });
}

// ── Settings Page ─────────────────────────────────────────────────────────────
async function loadSettings() {
  const [settings, wallets, learning] = await Promise.all([
    api('/settings'), api('/wallets'), api('/learning')
  ]);

  document.getElementById('page-settings-page').innerHTML = `
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-white">Settings</h1>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
      <div class="card">
        <h2 class="text-lg font-semibold text-white mb-3">Runtime Config</h2>
        <div class="grid grid-cols-2 gap-2 text-sm">
          ${settings.map(s => `<div class="flex items-center justify-between"><span class="text-gray-400">${s.key}:</span> <span class="editable-setting text-white font-mono text-xs cursor-pointer hover:text-indigo-300" data-key="${s.key}">${s.value}</span></div>`).join('')}
        </div>
      </div>
      <div class="card">
        <h2 class="text-lg font-semibold text-white mb-3">Saved Wallets</h2>
        ${wallets.length === 0 ? '<div class="text-gray-500 text-sm">No wallets saved</div>' : `
        <div class="space-y-2">
          ${wallets.map(w => `<div class="flex items-center justify-between p-2 rounded-lg bg-white/[0.03]">
            <span class="text-sm font-medium text-white">${w.label}</span>
            <span class="text-xs font-mono text-gray-400">${shortAddr(w.address)}</span>
          </div>`).join('')}
        </div>`}
      </div>
    </div>
    <div class="card">
      <h2 class="text-lg font-semibold text-white mb-3">Learning Lessons</h2>
      ${learning.lessons.length === 0 ? '<div class="text-gray-500 text-sm">No active lessons</div>' : `
      <div class="space-y-2">
        ${learning.lessons.map(l => `<div class="p-3 rounded-lg bg-white/[0.03] border-l-2 border-purple-500/50">
          <div class="text-sm text-gray-300">${l.lesson || '(empty)'}</div>
          <div class="text-xs text-gray-500 mt-1">${timeAgo(l.created_at_ms)}</div>
        </div>`).join('')}
      </div>`}
    </div>
  `;

  document.querySelectorAll('#page-settings-page .editable-setting').forEach(el => {
    el.addEventListener('dblclick', () => {
      const key = el.dataset.key;
      const current = el.textContent;
      const val = prompt(`Edit setting "${key}" (current: ${current}):`, current);
      if (val === null || val === '') return;
      charonApi('PATCH', '/settings', { key, value: val })
        .then(() => { notify(`"${key}" updated`); loadSettings(); })
        .catch(err => notify(err.message, 'error'));
    });
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
startAutoRefresh();
loadPage('overview');
</script>
</body>
</html>
