<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charon Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',sans-serif}.header{background:linear-gradient(135deg,#1e293e,#2a3365);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #253b5e}.header h1{font-size:20px;font-weight:700;color:#fff}.header .stats{display:flex;gap:16px;font-size:12px}.stat-item{text-align:center}.stat-item .val{color:#4ac9bf;font-size:14px;font-weight:600}.stat-item .label{color:#7b8cb8}.tabs{display:flex;gap:2px;padding:0 24px;background:#151c2d;border-bottom:1px solid #253b5e;overflow-x:auto}.tab{padding:10px 16px;color:#7b8cb8;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:13px;transition:all .2s}.tab.active{color:#fff;border-bottom:2px solid #4ac9bf}.tab:hover{color:#ddd}.content{padding:24px}.card{background:#1e293e;border-radius:8px;padding:16px;margin-bottom:16px;border:1px solid #253b5e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.section-title{font-size:18px;font-weight:600;margin:0 0 16px 0;color:#fff}.table-container{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;padding:8px 12px;color:#7b8cb8;border-bottom:1px solid #253b5e;white-space:nowrap}td{padding:8px 12px;border-bottom:1px solid #1e293e;white-space:nowrap}tr:hover{background:#253b5e}.badge{padding:2px 8px;border-radius:4px;font-size:11px}.bg-green{background:#0f421c;color:#4cc36e}.bg-red{background:#421c0f;color:#ff4444}.bg-yellow{background:#42370f;color:#ffd700}.bg-blue{background:#0f2842;color:#4ac9bf}.bg-purple{background:#280f42;color:#b854ff}.loading{text-align:center;padding:40px;color:#7b8cb8}.error{color:#ff4444;padding:16px}.highlight{color:#ffd700}.highlight-green{color:#4cc36e}.highlight-red{color:#ff4444}.highlight-blue{color:#4ac9bf}.highlight-purple{color:#b854ff}.small{font-size:10px;color:#7b8cb8}.mono{font-family:'Courier New',monospace}.no-data{text-align:center;padding:20px;color:#7b8cb8}.nav-info{display:flex;align-items:center;gap:8px}.nav-info .dot{width:8px;height:8px;border-radius:50%}.dot-live{background:#4cc36e}.dot-dry{background:#ffd700}.stat-card{text-align:center;padding:20px}.stat-card .val{font-size:28px;font-weight:700;color:#fff}.stat-card .label{font-size:12px;color:#7b8cb8;margin-top:4px}@media (max-width:768px){.grid{grid-template-columns:1fr}.tabs{padding:0 8px}.tab{padding:8px 12px;font-size:12px}.content{padding:12px}table{font-size:11px}th,td{padding:6px 8px}}
</style>
</head>
<body>
<div class="header">
<div>
<h1>Charon Dashboard</h1>
<div class="nav-info"><span class="dot" id="modeDot"></span><span id="tradingMode" class="small">loading...</span></div>
</div>
<div class="stats">
<div class="stat-item"><div class="val" id="stat-open">0</div><div class="label">Open</div></div>
<div class="stat-item"><div class="val" id="stat-pnl">0</div><div class="label">Portfolio Logs</div></div>
<div class="stat-item"><div class="val" id="stat-signals">0</div><div class="label">Signals</div></div>
<div class="stat-item"><div class="val" id="stat-candidates">0</div><div class="label">Candidates</div></div>
</div>
</div>
<div class="tabs">
<div class="tab active" data-tab="overview">Overview</div>
<div class="tab" data-tab="positions">Positions</div>
<div class="tab" data-tab="trades">Trades</div>
<div class="tab" data-tab="candidates">Candidates</div>
<div class="tab" data-tab="activity">Activity</div>
<div class="tab" data-tab="strategies">Strategies</div>
<div class="tab" data-tab="settings">Settings</div>
</div>
<div class="content" id="main-content">
<div id="view-overview" class="view"></div>
<div id="view-positions" class="view" style="display:none"></div>
<div id="view-trades" class="view" style="display:none"></div>
<div id="view-candidates" class="view" style="display:none"></div>
<div id="view-activity" class="view" style="display:none"></div>
<div id="view-strategies" class="view" style="display:none"></div>
<div id="view-settings" class="view" style="display:none"></div>
</div>
<script>
const REFRESH_INTERVAL = 5000;
const state = { activeTab:'overview', positions:[], allPositions:[], candidates:[], decisions:[], batches:[], decisionLogs:[], strategies:[], settings:[], wallets:[], signals:[], trades:[], stats:null, learning:null };
const $ = id => document.getElementById(id);
const e = tag => document.createElement(tag);
const append = (p,c) => { p.appendChild(c); return p; };
const empty = el => { while(el.firstChild) el.removeChild(el.firstChild); return el; };
const fetchApi = ep => fetch(ep).then(r=>r.json());
const fatDecimal = (v,d) => Number(v||0).toFixed(d);
const shortDate = ms => ms ? new Date(ms).toLocaleString() : '-';
const timeAgo = ms => { const s=(Date.now()-ms)/1000; if(s<60)return Math.floor(s)+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'; };
const drawTable = (cols, rows, renderRow) => { const div=e('div'); div.className='table-container'; const table=e('table'); const thead=e('thead'); const tr=e('tr'); cols.forEach(c=>{const th=e('th');th.textContent=c;append(tr,th)}); append(thead,tr); append(table,thead); const tbody=e('tbody'); rows.forEach((r,i)=>{const tr=e('tr');renderRow(tr,r,i);append(tbody,tr)}); append(table,tbody); append(div,table); return div; };
const statCard = (label, val, color) => { const card=e('div'); card.className='card stat-card'; const v=e('div'); v.className='val'+(color?' '+color:''); v.textContent=val; const l=e('div'); l.className='label'; l.textContent=label; append(card,v); append(card,l); return card; };

async function loadStats(){try{const d=await fetchApi('/api/stats');state.stats=d;$('stat-open').textContent=d.openPositions;$('stat-pnl').textContent=d.pnl.totalSol+' S';$('stat-signals').textContent=d.signalEvents;$('stat-candidates').textContent=d.totalCandidates;$('tradingMode').textContent=d.settings.tradingMode||'dry';$('modeDot').className='dot '+(d.settings.tradingMode==='live'?'dot-live':'dot-dry')}catch(e){console.error('stats:',e)}}
async function loadPositions(){try{state.positions=await fetchApi('/api/positions');state.allPositions=await fetchApi('/api/positions/all')}catch(e){console.error('pos:',e)}}
async function loadCandidates(){try{state.candidates=await fetchApi('/api/candidates?limit=500')}catch(e){console.error('candidates:',e)}}
async function loadDecisions(){try{state.decisions=await fetchApi('/api/decisions?limit=500');state.batches=await fetchApi('/api/batches?limit=50');state.decisionLogs=await fetchApi('/api/decision-logs?limit=100')}catch(e){console.error('decis:',e)}}
async function loadStrategies(){try{state.strategies=await fetchApi('/api/strategies')}catch(e){console.error('strat:',e)}}
async function loadSettings(){try{state.settings=await fetchApi('/api/settings')}catch(e){console.error('sett:',e)}}
async function loadSignals(){try{state.signals=await fetchApi('/api/signals?limit=100')}catch(e){console.error('sig:',e)}}
async function loadTrades(){try{state.trades=await fetchApi('/api/position-trades?limit=200')}catch(e){console.error('tr:',e)}}

async function renderOverview(){const v=empty($('view-overview'));if(!state.stats)return append(v,e('div')).appendChild(document.createTextNode('Loading...'));const d=state.stats;const g=e('div');g.className='grid';g.appendChild(statCard('Open Positions',d.openPositions,'highlight-blue'));g.appendChild(statCard('Total PnL',d.pnl.totalSol+' S '+d.pnl.wins+'W | '+d.pnl.losses+'L',d.pnl.totalSol>0?'highlight-green':'highlight-red'));g.appendChild(statCard('Win Rate',(d.pnl.wins/d.pnl.totalTrades*100||0).toFixed(1)+'%',d.pnl.avgPct>0?'highlight-green':'highlight-red'));g.appendChild(statCard('Signals',d.signalEvents,'highlight-yellow'));g.appendChild(statCard('Candidates',d.totalCandidates,'highlight-blue'));g.appendChild(statCard('Decisions',d.totalDecisions,'highlight-purple'));v.appendChild(g);if(d.activeStrategy){const sc=e('div');sc.className='card';sc.innerHTML='<h3>Active Strategy</h3><pre class="mono small">'+JSON.stringify(d.activeStrategy,null,2)+'</pre>';v.appendChild(sc)}}

async function renderPositions(){const v=empty($('view-positions'));if(!state.positions.length)return append(v,e('div')).appendChild(document.createTextNode('Loading...'));v.appendChild(drawTable(['Symbol','Mint','Status','Side','Entry','Exit','PnL Sol','PnL %','Mode'],state.positions.slice(0,50),(tr,r)=>{tr.innerHTML='<td>'+(r.symbol||r.mint?.slice(0,6)||'')+'</td><td><span class="mono">'+(r.mint?.slice(0,6)||'')+'</span></td><td>'+r.status+'</td><td>'+(r.side||'')+'</td><td>'+shortDate(r.opened_at_ms)+'</td><td>'+(r.closed_at_ms?shortDate(r.closed_at_ms):'-')+'</td><td>'+(r.pnl_sol||0).toFixed(4)+'</td><td>'+(r.pnl_percent||0).toFixed(2)+'</td><td>'+(r.execution_mode||'-')+'</td>'}))}

async function renderTrades(){const v=empty($('view-trades'));if(!state.trades.length)return append(v,e('div')).appendChild(document.createTextNode('Loading...'));v.appendChild(drawTable(['ID','Mint','Side','Price','MCap','Size Sol','Time'],state.trades,(tr,r)=>{tr.innerHTML='<td>'+r.id+'</td><td><span class="mono">'+(r.mint?.slice(0,8)||'')+'</span></td><td>'+r.side+'</td><td>'+(r.price||'-')+'</td><td>'+(r.mcap||'-')+'</td><td>'+(r.size_sol||'')+'</td><td>'+timeAgo(r.at_ms)+'</td>'}))}

async function renderCandidates(){const v=empty($('view-candidates'));if(!state.candidates.length)return append(v,e('div')).appendChild(document.createTextNode('Loading...'));v.appendChild(drawTable(['ID','Mint','Status','Signal','Age'],state.candidates,(tr,r)=>{tr.innerHTML='<td>'+r.id+'</td><td><span class="mono">'+(r.mint?.slice(0,8)||'')+'</span></td><td>'+r.status+'</td><td>'+(r.signal_key||'-')+'</td><td>'+timeAgo(r.created_at_ms)+'</td>'}))}

async function renderActivity(){const v=empty($('view-activity'));if(!state.decisions.length)return append(v,e('div')).appendChild(document.createTextNode('Loading...'));v.appendChild(drawTable(['Verdict','Mint','Confidence','Reason','Time'],state.decisions.slice(0,50),(tr,r)=>{tr.innerHTML='<td>'+r.verdict+'</td><td><span class="mono">'+(r.mint?.slice(0,6)||'')+'</span></td><td>'+fatDecimal(r.confidence,2)+'</td><td class="small">'+r.reason.slice(0,80)+'</td><td>'+timeAgo(r.created_at_ms)+'</td>'}))}

async function renderStrategies(){const v=empty($('view-strategies'));if(!state.strategies.length)return append(v,e('div')).appendChild(document.createTextNode('Loading...'));state.strategies.forEach(s=>{const card=e('div');card.className='card';card.innerHTML='<h3>'+s.name+' <span class="badge '+(s.enabled?'bg-green':'bg-red')+'">'+(s.enabled?'enabled':'disabled')+'</span></h3><pre class="mono small">'+JSON.stringify(s,null,2)+'</pre>';v.appendChild(card)})}

async function renderSettings(){const v=empty($('view-settings'));if(!state.settings.length)return append(v,e('div')).appendChild(document.createTextNode('Loading...'));v.appendChild(drawTable(['Key','Value'],state.settings,(tr,r)=>{tr.innerHTML='<td>'+r.key+'</td><td><div class="mono small">'+r.value+'</div></td>'}))}

async function refreshAll(){await Promise.all([loadStats(),loadPositions(),loadTrades(),loadCandidates(),loadDecisions(),loadStrategies(),loadSettings(),loadSignals()]);await renderOverview();const tab=state.activeTab;if(tab==='positions')await renderPositions();else if(tab==='trades')await renderTrades();else if(tab==='candidates')await renderCandidates();else if(tab==='activity')await renderActivity();else if(tab==='strategies')await renderStrategies();else if(tab==='settings')await renderSettings()}

document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click',()=>{state.activeTab=tab.getAttribute('data-tab');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');document.querySelectorAll('.view').forEach(t=>t.style.display='none');$('view-'+state.activeTab).style.display='block';if(state.activeTab==='overview')renderOverview();else if(state.activeTab==='positions')renderPositions();else if(state.activeTab==='trades')renderTrades();else if(state.activeTab==='candidates')renderCandidates();else if(state.activeTab==='activity')renderActivity();else if(state.activeTab==='strategies')renderStrategies();else if(state.activeTab==='settings')renderSettings()})});setInterval(()=>refreshAll(),REFRESH_INTERVAL);refreshAll()});
</script>
</body>
</html>
