<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charon Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { 800: '#1a1a2e', 900: '#0f0f1a', 700: '#16213e', 600: '#1a1a3e' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { font-family: 'Inter', sans-serif; }
    body { background: #0f0f1a; }
    .sidebar-item { @apply flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors; }
    .sidebar-item:hover { @apply bg-indigo-500/10 text-indigo-300; }
    .sidebar-item.active { @apply bg-indigo-500/20 text-indigo-400; }
    .card { @apply bg-dark-800/80 border border-white/5 rounded-xl p-5 backdrop-blur-sm; }
    .stat-value { @apply text-2xl font-bold text-white; }
    .stat-label { @apply text-xs text-gray-400 uppercase tracking-wider; }
    .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium; }
    .badge-green { @apply bg-emerald-500/20 text-emerald-400; }
    .badge-red { @apply bg-red-500/20 text-red-400; }
    .badge-yellow { @apply bg-yellow-500/20 text-yellow-400; }
    .badge-blue { @apply bg-blue-500/20 text-blue-400; }
    .badge-gray { @apply bg-gray-500/20 text-gray-400; }
    .badge-purple { @apply bg-purple-500/20 text-purple-400; }
    .table-header { @apply px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider; }
    .table-cell { @apply px-4 py-3 text-sm whitespace-nowrap; }
    .refresh-btn { @apply px-3 py-1.5 text-xs font-medium rounded-lg bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500/30 transition-colors; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .tab-btn { @apply px-4 py-2 text-sm font-medium rounded-lg transition-colors; }
    .tab-btn.active { @apply bg-indigo-500/20 text-indigo-400; }
    .tab-btn:not(.active) { @apply text-gray-400 hover:text-gray-300; }
    .skeleton { @apply animate-pulse bg-white/5 rounded; }
  </style>
</head>
<body class="dark text-gray-100">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <nav class="w-56 bg-dark-900 border-r border-white/5 flex flex-col p-3 shrink-0">
      <div class="px-4 py-5">

        <div class="text-xs text-gray-500 mt-0.5">Dashboard</div>
      </div>
      <div class="flex-1 space-y-1 overflow-y-auto">
        <a href="#" class="sidebar-item active" data-page="overview">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          Overview
        </a>
        <a href="#" class="sidebar-item" data-page="positions">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          Positions
        </a>
        <a href="#" class="sidebar-item" data-page="trades">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          Trades
        </a>
        <a href="#" class="sidebar-item" data-page="candidates">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
          Candidates
        </a>
        <a href="#" class="sidebar-item" data-page="activity">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Activity
        </a>
        <a href="#" class="sidebar-item" data-page="strategies">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Strategies
        </a>
        <a href="#" class="sidebar-item" data-page="settings-page">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Settings
        </a>
      </div>
      <div class="px-4 py-3 border-t border-white/5 mt-auto">
        <div class="flex items-center gap-2 text-xs text-gray-500">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400" id="status-dot"></span>
          <span id="last-update">Connecting...</span>
        </div>
        <button onclick="refreshAll()" class="refresh-btn w-full mt-2">Refresh</button>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6">
      <!-- Pages -->
      <div id="page-overview" class="page"></div>
      <div id="page-positions" class="page hidden"></div>
      <div id="page-trades" class="page hidden"></div>
      <div id="page-candidates" class="page hidden"></div>
      <div id="page-activity" class="page hidden"></div>
      <div id="page-strategies" class="page hidden"></div>
      <div id="page-settings-page" class="page hidden"></div>
    </main>
  </div>

<script>
// ── Utility Functions ─────────────────────────────────────────────────────────
function fmtSol(v) { const n = Number(v); return Number.isFinite(n) ? n.toFixed(4) + ' SOL' : '?'; }
function fmtUsd(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return '?';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(2);
}
function fmtPct(v) { const n = Number(v); return Number.isFinite(n) ? n.toFixed(1) + '%' : '?'; }
function shortAddr(a) { return a ? a.slice(0, 6) + '...' + a.slice(-4) : '?'; }
function timeAgo(ms) {
  if (!ms) return '';
  const sec = Math.floor((Date.now() - ms) / 1000);
  if (sec < 60) return sec + 's ago';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
  if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
  return Math.floor(sec / 86400) + 'd ago';
}
function fmtDate(ms) { return ms ? new Date(ms).toLocaleString() : ''; }

function pnlClass(pct) {
  const n = Number(pct);
  if (n > 0) return 'text-emerald-400';
  if (n < 0) return 'text-red-400';
  return 'text-gray-400';
}

function statusBadge(status) {
  const map = {
    open: 'badge-green', closed: 'badge-gray', candidate: 'badge-blue', filtered: 'badge-yellow',
    buy: 'badge-green', watch: 'badge-yellow', pass: 'badge-gray', ignored: 'badge-gray',
    pending_confirmation: 'badge-yellow', executed_live: 'badge-green', execution_failed: 'badge-red',
    rejected: 'badge-red', new: 'badge-blue',
  };
  const cls = map[status] || 'badge-gray';
  return `<span class="badge ${cls}">${status}</span>`;
}

function verdictBadge(v) {
  const map = { BUY: 'badge-green', WATCH: 'badge-yellow', PASS: 'badge-gray' };
  return `<span class="badge ${map[v] || 'badge-gray'}">${v || '?'}</span>`;
}

// ── Navigation ────────────────────────────────────────────────────────────────
const pages = ['overview', 'positions', 'trades', 'candidates', 'activity', 'strategies', 'settings-page'];
let currentPage = 'overview';

document.querySelectorAll('.sidebar-item').forEach(el => {
  el.addEventListener('click', e => {
    e.preventDefault();
    const page = el.dataset.page;
    if (!page) return;
    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    pages.forEach(p => document.getElementById('page-' + p).classList.add('hidden'));
    document.getElementById('page-' + page).classList.remove('hidden');
    currentPage = page;
    loadPage(page);
  });
});

// ── API Fetch ─────────────────────────────────────────────────────────────────
async function api(path) {
  const res = await fetch('/api' + path);
  if (!res.ok) throw new Error(res.statusText);
  return res.json();
}

async function charonApi(method, path, body) {
  const res = await fetch('/api' + path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function notify(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `fixed top-4 right-4 z-50 px-4 py-2 rounded-lg text-sm font-medium shadow-lg transition-all duration-300 ${
    type === 'success' ? 'bg-emerald-500/90 text-white' : 'bg-red-500/90 text-white'
  }`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
}

let refreshInterval = null;

function startAutoRefresh() {
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(() => {
    loadPage(currentPage);
  }, 5000);
}

async function refreshAll() {
  document.getElementById('last-update').textContent = 'Refreshing...';
  await loadPage(currentPage);
}

async function loadPage(page) {
  try {
    document.getElementById('status-dot').className = 'inline-block w-2 h-2 rounded-full bg-yellow-400';
    document.getElementById('last-update').textContent = 'Loading...';
    const handlers = {
      overview: loadOverview,
      positions: loadPositions,
      trades: loadTrades,
      candidates: loadCandidates,
      activity: loadActivity,
      strategies: loadStrategies,
      'settings-page': loadSettings,
    };
    if (handlers[page]) await handlers[page]();
    document.getElementById('status-dot').className = 'inline-block w-2 h-2 rounded-full bg-emerald-400';
    document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('status-dot').className = 'inline-block w-2 h-2 rounded-full bg-red-400';
    document.getElementById('last-update').textContent = 'Error: ' + err.message;
  }
}

// ── Overview Page ─────────────────────────────────────────────────────────────
async function loadOverview() {
  const [stats, positions, recentTrades] = await Promise.all([
    api('/stats'), api('/positions'), api('/trades')
  ]);

  document.getElementById('page-overview').innerHTML = `
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-white">Overview</h1>
      <p class="text-sm text-gray-400 mt-1">Real-time Charon bot status and performance</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="card">
        <div class="stat-label">Agent Status</div>
        <div class="stat-value flex items-center gap-2 mt-1">
          <span class="inline-block w-3 h-3 rounded-full ${stats.settings.agentEnabled === 'true' ? 'bg-emerald-400' : 'bg-gray-500'}"></span>
          ${stats.settings.agentEnabled === 'true' ? 'Active' : 'Disabled'}
        </div>
        <div class="text-sm text-gray-400 mt-1">Mode: <span class="text-indigo-400 font-medium">${stats.settings.tradingMode}</span></div>
      </div>
      <div class="card">
        <div class="stat-label">Active Strategy</div>
        <div class="stat-value text-lg mt-1">${stats.activeStrategy ? stats.activeStrategy.name : 'None'}</div>
        <div class="text-sm text-gray-400 mt-1">Size: ${fmtSol(stats.activeStrategy?.position_size_sol)} &middot; TP: ${fmtPct(stats.activeStrategy?.tp_percent)} &middot; SL: ${fmtPct(stats.activeStrategy?.sl_percent)}</div>
      </div>
      <div class="card">
        <div class="stat-label">Open Positions</div>
        <div class="stat-value mt-1">${stats.openPositions}</div>
        <div class="text-sm text-gray-400 mt-1">Live: ${stats.livePositions} &middot; Closed: ${stats.closedPositions}</div>
      </div>
      <div class="card">
        <div class="stat-label">PnL (Closed)</div>
        <div class="stat-value ${pnlClass(stats.pnl.totalSol)} mt-1">${Number(stats.pnl.totalSol).toFixed(4)} SOL</div>
        <div class="text-sm text-gray-400 mt-1">Avg: ${fmtPct(stats.pnl.avgPct)} &middot; ${stats.pnl.wins}W / ${stats.pnl.losses}L</div>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="card">
        <div class="stat-label">Candidates</div>
        <div class="stat-value text-lg mt-1">${stats.totalCandidates}</div>
        <div class="text-sm text-gray-400">LLM Decisions: ${stats.totalDecisions}</div>
      </div>
      <div class="card">
        <div class="stat-label">Signal Events</div>
        <div class="stat-value text-lg mt-1">${stats.signalEvents}</div>
        <div class="text-sm text-gray-400">LLM Batches: ${stats.totalBatches}</div>
      </div>
      <div class="card">
        <div class="stat-label">Pending Intents</div>
        <div class="stat-value text-lg mt-1">${stats.pendingIntents}</div>
        <div class="text-sm text-gray-400">Awaiting confirmation</div>
      </div>
      <div class="card">
        <div class="stat-label">Win Rate</div>
        <div class="stat-value text-lg mt-1">${stats.pnl.totalTrades > 0 ? ((stats.pnl.wins / stats.pnl.totalTrades) * 100).toFixed(1) + '%' : '0%'}</div>
        <div class="text-sm text-gray-400">${stats.pnl.totalTrades} total trades</div>
      </div>
    </div>
    <div class="card mb-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-white">Top Open Positions</h2>
        <span class="text-xs text-gray-500">${positions.length} positions</span>
      </div>
      ${positions.length === 0 ? '<div class="text-gray-500 text-sm py-8 text-center">No open positions</div>' : `
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
            <tr class="border-b border-white/5">
              <th class="table-header">Token</th>
              <th class="table-header">Entry Mcap</th>
              <th class="table-header">Size</th>
              <th class="table-header">TP / SL</th>
              <th class="table-header">Age</th>
              <th class="table-header">Mode</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-white/5">
            ${positions.slice(0, 5).map(p => `
            <tr class="hover:bg-white/[0.02]">
              <td class="table-cell font-medium text-white">${p.symbol || shortAddr(p.mint)}</td>
              <td class="table-cell">${fmtUsd(p.entry_mcap)}</td>
              <td class="table-cell">${fmtSol(p.size_sol)}</td>
              <td class="table-cell">${fmtPct(p.tp_percent)} / ${fmtPct(p.sl_percent)}</td>
              <td class="table-cell text-gray-400">${timeAgo(p.opened_at_ms)}</td>
              <td class="table-cell">${statusBadge(p.execution_mode || 'dry_run')}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
  `;
}

// ── Positions Page ────────────────────────────────────────────────────────────
async function loadPositions() {
  const [allPositions, trades] = await Promise.all([api('/positions/all'), api('/position-trades')]);

  const open = allPositions.filter(p => p.status === 'open');
  const closed = allPositions.filter(p => p.status === 'closed');

  document.getElementById('page-positions').innerHTML = `
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-white">Positions</h1>
      <p class="text-sm text-gray-400 mt-1">${open.length} open, ${closed.length} closed</p>
    </div>
    <div class="flex gap-2 mb-4">
      <button class="tab-btn active" data-tab="pos-open">Open (${open.length})</button>
      <button class="tab-btn" data-tab="pos-closed">Closed (${closed.length})</button>
      <button class="tab-btn" data-tab="pos-trades">Trades (${trades.length})</button>
    </div>
    <div id="pos-open" class="tab-content">
      ${open.length === 0 ? '<div class="card text-gray-500 text-sm py-8 text-center">No open positions</div>' : `
      <div class="card p-0 overflow-x-auto">
        <table class="w-full">
          <thead><tr class="border-b border-white/5">
            <th class="table-header">ID</th><th class="table-header">Token</th><th class="table-header">Entry Mcap</th><th class="table-header">Size</th>
            <th class="table-header">TP</th><th class="table-header">SL</th><th class="table-header">Trail</th><th class="table-header">Opened</th><th class="table-header">Mode</th><th class="table-header">Actions</th>
          </tr></thead>
          <tbody class="divide-y divide-white/5">
            ${open.map(p => `<tr class="hover:bg-white/[0.02]">
              <td class="table-cell text-gray-400">#${p.id}</td>
              <td class="table-cell"><span class="font-medium text-white">${p.symbol || '?'}</span><br><span class="text-xs text-gray-500">${shortAddr(p.mint)}</span></td>
              <td class="table-cell">${fmtUsd(p.entry_mcap)}</td>
              <td class="table-cell">${fmtSol(p.size_sol)}</td>
              <td class="table-cell text-emerald-400">
                <span class="editable-tp" data-id="${p.id}" data-field="tp_percent">${fmtPct(p.tp_percent)}</span>
              </td>
              <td class="table-cell text-red-400">
                <span class="editable-sl" data-id="${p.id}" data-field="sl_percent">${fmtPct(p.sl_percent)}</span>
              </td>
              <td class="table-cell">
                <button class="trail-btn text-xs underline hover:text-indigo-300" data-id="${p.id}">${p.trailing_enabled ? fmtPct(p.trailing_percent) : 'off'}</button>
              </td>
              <td class="table-cell text-gray-400">${timeAgo(p.opened_at_ms)}</td>
              <td class="table-cell">${statusBadge(p.execution_mode || 'dry_run')}</td>
              <td class="table-cell">
                <button class="close-btn text-xs bg-red-500/20 text-red-400 hover:bg-red-500/30 px-2 py-1 rounded" data-id="${p.id}">Close</button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
    <div id="pos-closed" class="tab-content hidden">
      ${closed.length === 0 ? '<div class="card text-gray-500 text-sm py-8 text-center">No closed positions</div>' : `
      <div class="card p-0 overflow-x-auto">
        <table class="w-full">
          <thead><tr class="border-b border-white/5">
            <th class="table-header">ID</th><th class="table-header">Token</th><th class="table-header">Entry</th><th class="table-header">Size</th>
            <th class="table-header">PnL %</th><th class="table-header">PnL SOL</th><th class="table-header">Reason</th><th class="table-header">Held</th><th class="table-header">Mode</th>
          </tr></thead>
          <tbody class="divide-y divide-white/5">
            ${closed.map(p => `<tr class="hover:bg-white/[0.02]">
              <td class="table-cell text-gray-400">#${p.id}</td>
              <td class="table-cell"><span class="font-medium text-white">${p.symbol || '?'}</span><br><span class="text-xs text-gray-500">${shortAddr(p.mint)}</span></td>
              <td class="table-cell">${fmtUsd(p.entry_mcap)}</td>
              <td class="table-cell">${fmtSol(p.size_sol)}</td>
              <td class="table-cell font-medium ${pnlClass(p.pnl_percent)}">${fmtPct(p.pnl_percent)}</td>
              <td class="table-cell font-medium ${pnlClass(p.pnl_sol)}">${fmtSol(p.pnl_sol)}</td>
              <td class="table-cell">${statusBadge(p.exit_reason || 'closed')}</td>
              <td class="table-cell text-gray-400">${p.opened_at_ms && p.closed_at_ms ? timeAgo(p.opened_at_ms).replace(' ago','') : '?'}</td>
              <td class="table-cell">${statusBadge(p.execution_mode || 'dry_run')}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
    <div id="pos-trades" class="tab-content hidden">
      <div class="card p-0 overflow-x-auto">
        <table class="w-full">
          <thead><tr class="border-b border-white/5">
            <th class="table-header">ID</th><th class="table-header">Pos#</th><th class="table-header">Side</th><th class="table-header">Mint</th><th class="table-header">Price</th><th class="table-header">Mcap</th><th class="table-header">Size</th><th class="table-header">Reason</th><th class="table-header">Time</th>
          </tr></thead>
          <tbody class="divide-y divide-white/5">
            ${trades.map(t => `<tr class="hover:bg-white/[0.02]">
              <td class="table-cell text-gray-400">#${t.id}</td>
              <td class="table-cell text-gray-400">#${t.position_id}</td>
              <td class="table-cell"><span class="badge ${t.side === 'buy' ? 'badge-green' : 'badge-red'}">${t.side}</span></td>
              <td class="table-cell text-xs font-mono">${shortAddr(t.mint)}</td>
              <td class="table-cell">${fmtUsd(t.price)}</td>
              <td class="table-cell">${fmtUsd(t.mcap)}</td>
              <td class="table-cell">${fmtSol(t.size_sol)}</td>
              <td class="table-cell text-xs text-gray-400">${t.reason || ''}</td>
              <td class="table-cell text-gray-400 text-xs">${timeAgo(t.at_ms)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Tab switching
  document.querySelectorAll('#page-positions .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#page-positions .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('#page-positions .tab-content').forEach(c => c.classList.add('hidden'));
      document.getElementById(btn.dataset.tab).classList.remove('hidden');
    });
  });

  // Close position buttons
  document.querySelectorAll('#page-positions .close-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      if (!confirm(`Close position #${id}?`)) return;
      try {
        await charonApi('POST', `/close-position/${id}`, { reason: 'MANUAL' });
        notify(`Position #${id} closed`);
        loadPositions();
      } catch (err) { notify(err.message, 'error'); }
    });
  });

  // Toggle trailing buttons
  document.querySelectorAll('#page-positions .trail-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      try {
        await charonApi('POST', `/toggle-trailing/${id}`);
        notify(`Trailing toggled for #${id}`);
        loadPositions();
      } catch (err) { notify(err.message, 'error'); }
    });
  });

  // Editable TP/SL - click to edit inline
  document.querySelectorAll('#page-positions .editable-tp, #page-positions .editable-sl').forEach(el => {
    el.addEventListener('dblclick', () => {
      const id = el.dataset.id;
      const field = el.dataset.field;
      const current = parseFloat(el.textContent);
      const val = prompt(`Enter new ${field} (current: ${current}):`, current);
      if (val === null || val === '') return;
      const num = parseFloat(val);
      if (isNaN(num)) return notify('Invalid number', 'error');
      charonApi('PATCH', `/position/${id}/rule`, { field, value: num })
        .then(() => { notify(`${field} updated to ${num}%`); loadPositions(); })
        .catch(err => notify(err.message, 'error'));
    });
  });
}

// ── Trades Page ───────────────────────────────────────────────────────────────
async function loadTrades() {
  const [allPositions, trades] = await Promise.all([api('/positions/all'), api('/position-trades')]);
  const closed = allPositions.filter(p => p.status === 'closed');

  const totalPnlSol = closed.reduce((sum, p) => sum + Number(p.pnl_sol || 0), 0);
  const wins = closed.filter(p => Number(p.pnl_sol) > 0).length;
  const losses = closed.filter(p => Number(p.pnl_sol) <= 0).length;

  document.getElementById('page-trades').innerHTML = `
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-white">Trades & PnL</h1>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="card"><div class="stat-label">Total PnL</div><div class="stat-value ${pnlClass(totalPnlSol)} mt-1">${fmtSol(totalPnlSol)}</div></div>
      <div class="card"><div class="stat-label">Win Rate</div><div class="stat-value text-lg mt-1">${closed.length > 0 ? (wins / closed.length * 100).toFixed(1) + '%' : '0%'}</div></div>
      <div class="card"><div class="stat-label">Wins / Losses</div><div class="stat-value text-lg mt-1"><span class="text-emerald-400">${wins}</span> / <span class="text-red-400">${losses}</span></div></div>
      <div class="card"><div class="stat-label">Total Trades</div><div class="stat-value text-lg mt-1">${closed.length}</div></div>
    </div>
    <div class="card mb-6 p-0 overflow-x-auto">
      <table class="w-full">
        <thead><tr class="border-b border-white/5">
          <th class="table-header">ID</th><th class="table-header">Token</th><th class="table-header">Entry</th><th class="table-header">Exit</th><th class="table-header">Size</th>
          <th class="table-header">PnL %</th><th class="table-header">PnL SOL</th><th class="table-header">Exit Reason</th><th class="table-header">Mode</th><th class="table-header">Date</th>
        </tr></thead>
        <tbody class="divide-y divide-white/5">
          ${closed.map(p => `<tr class="hover:bg-white/[0.02]">
            <td class="table-cell text-gray-400">#${p.id}</td>
            <td class="table-cell"><span class="font-medium text-white">${p.symbol || '?'}</span><br><span class="text-xs text-gray-500">${shortAddr(p.mint)}</span></td>
            <td class="table-cell">${fmtUsd(p.entry_mcap)}</td>
            <td class="table-cell">${fmtUsd(p.exit_mcap)}</td>
            <td class="table-cell">${fmtSol(p.size_sol)}</td>
            <td class="table-cell font-bold ${pnlClass(p.pnl_percent)}">${fmtPct(p.pnl_percent)}</td>
            <td class="table-cell font-bold ${pnlClass(p.pnl_sol)}">${fmtSol(p.pnl_sol)}</td>
            <td class="table-cell">${statusBadge(p.exit_reason || '-')}</td>
            <td class="table-cell">${statusBadge(p.execution_mode || 'dry_run')}</td>
            <td class="table-cell text-gray-400 text-xs">${fmtDate(p.closed_at_ms)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// ── Candidates Page ───────────────────────────────────────────────────────────
async function loadCandidates() {
  const [candidates, decisions] = await Promise.all([api('/candidates?limit=100'), api('/decisions?limit=100')]);

  const decisionMap = {};
  decisions.forEach(d => { decisionMap[d.candidate_id] = d; });

  document.getElementById('page-candidates').innerHTML = `
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-white">Candidates</h1>
      <p class="text-sm text-gray-400 mt-1">${candidates.length} recent candidates</p>
    </div>
    <div class="card p-0 overflow-x-auto">
      <table class="w-full">
        <thead><tr class="border-b border-white/5">
          <th class="table-header">ID</th><th class="table-header">Token</th><th class="table-header">Route</th><th class="table-header">Mcap</th>
          <th class="table-header">Price</th><th class="table-header">Liquidity</th><th class="table-header">Holders</th><th class="table-header">Status</th>
          <th class="table-header">Verdict</th><th class="table-header">Age</th><th class="table-header">Action</th>
        </tr></thead>
        <tbody class="divide-y divide-white/5">
          ${candidates.map(c => {
            const d = decisionMap[c.id];
            const cand = c.candidate_json || {};
            const token = cand.token || {};
            const metrics = cand.metrics || {};
            return `<tr class="hover:bg-white/[0.02]">
              <td class="table-cell text-gray-400">#${c.id}</td>
              <td class="table-cell"><span class="font-medium text-white">${token.symbol || '?'}</span><br><span class="text-xs text-gray-500">${shortAddr(token.mint || c.mint)}</span></td>
              <td class="table-cell text-xs text-gray-400">${(cand.signals || {}).label || c.route || '-'}</td>
              <td class="table-cell">${fmtUsd(metrics.marketCapUsd)}</td>
              <td class="table-cell">${fmtUsd(metrics.priceUsd)}</td>
              <td class="table-cell">${fmtUsd(metrics.liquidityUsd)}</td>
              <td class="table-cell">${metrics.holderCount || '-'}</td>
              <td class="table-cell">${statusBadge(c.status)}</td>
              <td class="table-cell">${d ? verdictBadge(d.verdict) : '-'}</td>
              <td class="table-cell text-gray-400 text-xs">${timeAgo(c.created_at_ms)}</td>
              <td class="table-cell">
                ${c.status === 'candidate' ? `<button class="buy-btn text-xs bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30 px-2 py-1 rounded" data-id="${c.id}">Buy</button>` : '-'}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.querySelectorAll('#page-candidates .buy-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      if (!confirm(`Buy candidate #${id}?`)) return;
      try {
        await charonApi('POST', `/execute-buy/${id}`);
        notify(`Buy order submitted for #${id}`);
        loadCandidates();
      } catch (err) { notify(err.message, 'error'); }
    });
  });
}
